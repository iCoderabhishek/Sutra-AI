name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs tags and history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Test
        working-directory: apps/cli
        run: go test ./...

      # The backend URL is compiled into the binary. It is public, so a repo
      # variable can override it, but releases fall back to the hosted API
      # instead of localhost, which would break every installed copy.
      - name: Resolve backend URL
        env:
          URL: ${{ vars.SUTRA_BACKEND_URL || 'https://api.sutraai.0bhishek.com' }}
        run: |
          case "$URL" in
            https://*) echo "SUTRA_BACKEND_URL=$URL" >> "$GITHUB_ENV"; echo "Backend: $URL" ;;
            *) echo "SUTRA_BACKEND_URL must be an https URL, got: $URL" >&2; exit 1 ;;
          esac

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: apps/cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
