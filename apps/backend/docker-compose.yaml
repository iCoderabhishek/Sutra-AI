services:
  postgress:
    image: postgres:16-alpine
    container_name: sutra-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sutra}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - sutra-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutra

  redis:
    image: redis:latest
    container_name: sutra-redis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - sutra-redis:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutra

  app:
    build:
      context: ../../
      dockerfile: apps/backend/Dockerfile
    container_name: sutra-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgress:5432/${POSTGRES_DB:-sutra}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${PORT:-4000}:${PORT:-4000}"
    depends_on:
      postgress:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sutra

volumes:
  sutra-db:
  sutra-redis:

networks:
  sutra:
    driver: bridge