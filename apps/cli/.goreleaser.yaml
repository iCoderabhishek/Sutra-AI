# Builds the sutra CLI for Linux, macOS and Windows and attaches the archives
# to a GitHub Release. Run by .github/workflows/release-cli.yml on a v* tag.
version: 2

project_name: sutra

builds:
  - id: sutra
    main: ./sutra
    binary: sutra
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      # The hosted backend, from the SUTRA_BACKEND_URL repo variable.
      - -X github.com/iCoderabhishek/Sutra-AI/apps/cli/internal/config.DefaultBackendURL={{ envOrDefault "SUTRA_BACKEND_URL" "http://localhost:4000" }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
